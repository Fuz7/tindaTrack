<span class="material-symbols-outlined text-primary">settings</span>
</button>
</header>
<main class="pb-40">
<!-- Search & Minimized Keypad Area -->
<div class="p-4 bg-surface-container-low">
<div class="relative mb-4">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary font-label-caps text-label-caps outline-none" placeholder="SEARCH ITEMS..." type="text">
</div>
<!-- Quick Category Tabs -->
<div class="flex gap-2 overflow-x-auto cart-item-list">
<button class="px-4 py-2 bg-primary text-on-primary rounded-lg font-label-caps text-label-caps whitespace-nowrap">ALL ITEMS</button>
<button class="px-4 py-2 bg-surface-container-highest text-on-surface-variant rounded-lg font-label-caps text-label-caps whitespace-nowrap">SNACKS</button>
<button class="px-4 py-2 bg-surface-container-highest text-on-surface-variant rounded-lg font-label-caps text-label-caps whitespace-nowrap">DRINKS</button>
<button class="px-4 py-2 bg-surface-container-highest text-on-surface-variant rounded-lg font-label-caps text-label-caps whitespace-nowrap">CANNED</button>
</div>
</div>
<!-- Active Cart Section -->
<section class="px-4 py-2">
<div class="flex justify-between items-center mb-4">
<h2 class="font-headline-md text-headline-md text-on-surface">Active Cart</h2>
<span class="bg-secondary-container text-on-secondary-container px-2 py-1 rounded text-xs font-bold">5 ITEMS</span>
</div>
<!-- Cart Items List -->
<div class="space-y-2">
<!-- Item 1 -->

<span class="material-symbols-outlined text-primary">chips</span>
</div>
<div class="ml-3 flex-grow">
<div class="flex justify-between">

</div>
<div class="flex justify-between items-center mt-1">

<span class="px-3 font-bold text-primary">2</span>

</div>

</div>
</div>
</div>
<!-- Item 2 -->

</div>

<div class="flex justify-between">

</div>
<div class="flex justify-between items-center mt-1">
<div class="flex items-center bg-surface-container-low rounded-lg p-0.5 border border-outline-variant">
<button class="w-8 h-8 flex items-center justify-center text-primary active:scale-95"><span class="material-symbols-outlined">remove</span></button>
<span class="px-3 font-bold text-primary">2</span>

</div>
<span class="text-on-surface-variant font-label-caps text-label-caps">₱20.00 / EA</span>
</div>
</div>
</div>
<!-- Item 3 -->
<div class="flex items-center p-3 bg-surface-container-lowest border border-surface-border rounded-xl transition-all active:bg-surface-container-low">
<div class="w-12 h-12 bg-surface-container-high rounded-lg flex-shrink-0 flex items-center justify-center">
<span class="material-symbols-outlined text-primary">egg</span>
</div>
<div class="ml-3 flex-grow">
<div class="flex justify-between">
<span class="font-body-lg text-body-lg text-on-surface">Egg (Large)</span>

<span class="font-label-caps text-label-caps">ADD DISCOUNT OR CUSTOM ITEM</span>

<!-- Checkout Footer -->
<div class="fixed bottom-16 left-0 w-full bg-surface-container-lowest shadow-[0_-4px_20px_-10px_rgba(0,0,0,0.1)] border-t border-outline-variant z-40 p-4">
<div class="flex justify-between items-end mb-4 px-2">
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant">SUBTOTAL</p>

<div class="grid grid-cols-5 gap-2">
<button class="col-span-1 bg-surface-container-highest text-on-surface flex items-center justify-center rounded-xl h-14 active:scale-95 transition-all">
<span class="material-symbols-outlined">delete</span>
</button>
<button class="col-span-4 bg-primary text-on-primary font-headline-md text-headline-md rounded-xl h-14 flex items-center justify-center gap-3 active:scale-[0.98] transition-all shadow-lg shadow-primary/20" onclick="handleCheckout()">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">shopping_cart_checkout</span>
                CHECKOUT
            </button>
</div>
</div>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-container-margin pb-safe bg-surface dark:bg-surface-dim border-t border-outline-variant dark:border-outline shadow-lg z-50 h-16">
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl p-2 active:scale-95 duration-100 transition-all" href="#">

<a class="flex flex-col items-center justify-center text-on-secondary-fixed-variant p-2 hover:bg-surface-container-low active:scale-95 duration-100 transition-all" href="#">

<a class="flex flex-col items-center justify-center text-on-secondary-fixed-variant p-2 hover:bg-surface-container-low active:scale-95 duration-100 transition-all" href="#">

<span class="material-symbols-outlined">analytics</span>
</a>
</nav>
<!-- Simple Haptic Feedback Script & Micro-interactions -->
<script>
        function handleCheckout() {
            // Simulated haptic/visual feedback
            const btn = event.currentTarget;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> PROCESSING...';
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> SUCCESS';
                btn.classList.replace('bg-primary', 'bg-status-in-stock');
                setTimeout(() => {
                    btn.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">shopping_cart_checkout</span> CHECKOUT';
                    btn.classList.replace('bg-status-in-stock', 'bg-primary');
                }, 2000);
            }, 800);
        }

        // Add active state styles to items for better touch feedback
        document.querySelectorAll('.active\\:bg-surface-container-low').forEach(item => {
            item.addEventListener('touchstart', () => {
                item.style.transform = 'scale(0.98)';
            });
            item.addEventListener('touchend', () => {
                item.style.transform = 'scale(1)';
            });
        });
    </script>
</body></html>
