<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-sm max-w-md mx-auto relative overflow-hidden">
<!-- Top Navigation (Transactional Layout - Back button instead of generic TopAppBar) -->
<header class="flex justify-between items-center px-gutter h-touch-target border-b border-surface-border bg-surface fixed top-0 w-full z-50 max-w-md">
<button aria-label="Go back" class="flex items-center justify-center w-10 h-10 -ml-2 text-on-surface-variant hover:bg-surface-container-low active:bg-surface-container-high rounded-full transition-colors duration-150" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface flex-1 text-center pr-8">Create New Tindahan</h1>
</header>
<!-- Main Content Area -->
<main class="flex-1 pt-20 pb-24 px-container-margin overflow-y-auto">
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<!-- Store Name Field -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase flex items-center gap-1" for="store_name">
                    Store Name <span aria-hidden="true" class="text-error">*</span>
</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant" style="font-variation-settings: 'FILL' 0;">storefront</span>
<input class="form-input w-full h-12 pl-10 pr-4 bg-surface-container-lowest border border-surface-border rounded text-body-lg font-body-lg text-on-surface focus:border-primary focus:border-2 focus:ring-0 placeholder:text-outline-variant" id="store_name" name="store_name" placeholder="e.g., Aling Nena's Sari-Sari" required="" type="text"/>
</div>
</div>
<!-- Owner Name Field -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase flex items-center gap-1" for="owner_name">
                    Owner Name <span aria-hidden="true" class="text-error">*</span>
</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant" style="font-variation-settings: 'FILL' 0;">person</span>
<input class="form-input w-full h-12 pl-10 pr-4 bg-surface-container-lowest border border-surface-border rounded text-body-lg font-body-lg text-on-surface focus:border-primary focus:border-2 focus:ring-0 placeholder:text-outline-variant" id="owner_name" name="owner_name" placeholder="Juan Dela Cruz" required="" type="text"/>
</div>
</div>
<!-- Store Address Field (Optional) -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase flex justify-between items-center" for="store_address">
<span>Store Address</span>
<span class="text-outline-variant text-[10px] lowercase font-normal tracking-normal">(Optional)</span>
</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-3 text-outline-variant" style="font-variation-settings: 'FILL' 0;">location_on</span>
<textarea class="form-input w-full py-3 pl-10 pr-4 bg-surface-container-lowest border border-surface-border rounded text-body-lg font-body-lg text-on-surface focus:border-primary focus:border-2 focus:ring-0 placeholder:text-outline-variant resize-none" id="store_address" name="store_address" placeholder="Enter full address or landmark..." rows="3"></textarea>
</div>
</div>
<!-- Optional Visual Element to break up the form -->
<div class="mt-4 p-4 bg-surface-container-low border border-surface-border rounded flex items-start gap-3">
<span class="material-symbols-outlined text-primary mt-0.5" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                     You can update your store details anytime from the Settings menu after setup.
                 </p>
</div>
</form>
</main>
<!-- Bottom Action Area (Sticky) -->
<div class="fixed bottom-0 w-full max-w-md bg-surface border-t border-surface-border p-container-margin z-50">
<button class="w-full h-14 bg-primary text-on-primary font-headline-md text-headline-md rounded flex items-center justify-center gap-2 hover:bg-primary-container active:bg-on-primary-fixed-variant transition-colors shadow-sm" type="button">
<span>Create Store</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
