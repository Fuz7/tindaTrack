<!DOCTYPE html><html class="light" lang="en" style=""><head>

                        "inverse-surface": "#2c322e",

                        "status-low-stock": "#F59E0B",

                        "secondary-container": "#dae2fd",
                        "on-secondary-container": "#5c647a",
                        "surface-bright": "#f5fbf5",
                        "on-surface": "#171d19",
                        "on-secondary-fixed": "#131b2e",
                        "tertiary": "#9b3e3b",
                        "tertiary-fixed-dim": "#ffb3ae",
                        "surface-container-low": "#eff5ef",
                        "on-error-container": "#93000a",
                        "primary": "#006948",
                        "on-error": "#ffffff",
                        "status-in-stock": "#10B981",
                        "on-surface-variant": "#3d4a42",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#ffdad7",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#ecf2ec",
                        "surface-dim": "#d5dcd6",
                        "on-background": "#171d19",
                        "tertiary-container": "#ba5551",
                        "surface-container-highest": "#dee4de",
                        "primary-container": "#00855d",
                        "secondary-fixed-dim": "#bec6e0",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface": "#f5fbf5",
                        "surface-tint": "#006c4a",
                        "inverse-primary": "#68dba9",
                        "on-tertiary-fixed-variant": "#7f2928",

                        "surface-border": "#E2E8F0",

                        "action-destructive": "#B91C1C",
                        "on-tertiary-container": "#fffbff",
                        "on-primary-fixed-variant": "#005137"

                    "borderRadius": {

                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"

<body class="bg-background text-on-background font-body-lg min-h-screen flex flex-col items-center">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-surface border-b border-surface-border flex justify-between items-center px-gutter h-touch-target">
<div class="flex items-center gap-stack-sm">
<span class="material-symbols-outlined text-primary">storefront</span>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">TindaTrack</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">settings</span>
</button>
</header>
<!-- Overlay Container / Main Content -->
<main class="w-full max-w-md pt-touch-target flex-1 flex flex-col">
<!-- Header Section -->
<div class="px-container-margin py-stack-md bg-surface-bright">
<div class="flex items-center justify-between">
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-secondary uppercase">Utility Overlay</span>
<h2 class="font-headline-md text-headline-md text-on-surface">Stock Tally</h2>
</div>
<button class="p-2 hover:bg-surface-container-high rounded-full transition-all" onclick="window.history.back()">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</div>
<!-- Display Area -->
<div class="flex-1 px-container-margin py-stack-md flex flex-col justify-end bg-surface-container-lowest border-y border-surface-border">
<div class="tally-scroll h-24 overflow-y-auto mb-stack-sm text-right flex flex-col justify-end" id="tally-history">
<span class="text-secondary font-body-sm tracking-wide opacity-60" id="calculation-string">12 + 12 + 6</span>
</div>
<div class="flex items-baseline justify-end gap-2">
<span class="font-label-caps text-label-caps text-primary-container mb-2">TOTAL</span>
<div class="font-display-price text-display-price text-on-surface" id="display-total">30</div>
</div>
</div>
<!-- Numeric Keypad (The Monolith Grid) -->
<div class="grid grid-cols-4 bg-surface-border"><!-- Row 1 -->
<button class="active-press bg-white h-20 flex items-center justify-center font-numeric-keypad text-numeric-keypad border-[0.5px] border-surface-border" onclick="appendNum('7')">7</button>
<button class="active-press bg-white h-20 flex items-center justify-center font-numeric-keypad text-numeric-keypad border-[0.5px] border-surface-border" onclick="appendNum('8')">8</button>
<button class="active-press bg-white h-20 flex items-center justify-center font-numeric-keypad text-numeric-keypad border-[0.5px] border-surface-border" onclick="appendNum('9')">9</button>
<button class="active-press bg-surface-container h-20 flex items-center justify-center font-label-caps text-label-caps text-tertiary border-[0.5px] border-surface-border" onclick="clearTally()">CLEAR</button>
<!-- Row 2 -->
<button class="active-press bg-white h-20 flex items-center justify-center font-numeric-keypad text-numeric-keypad border-[0.5px] border-surface-border" onclick="appendNum('4')">4</button>
<button class="active-press bg-white h-20 flex items-center justify-center font-numeric-keypad text-numeric-keypad border-[0.5px] border-surface-border" onclick="appendNum('5')">5</button>
<button class="active-press bg-white h-20 flex items-center justify-center font-numeric-keypad text-numeric-keypad border-[0.5px] border-surface-border" onclick="appendNum('6')">6</button>
<button class="active-press bg-surface-container h-20 flex items-center justify-center border-[0.5px] border-surface-border" onclick="addOperator('*')">
<span class="material-symbols-outlined text-primary text-3xl">close</span>
</button>
<!-- Row 3 -->
<button class="active-press bg-white h-20 flex items-center justify-center font-numeric-keypad text-numeric-keypad border-[0.5px] border-surface-border" onclick="appendNum('1')">1</button>
<button class="active-press bg-white h-20 flex items-center justify-center font-numeric-keypad text-numeric-keypad border-[0.5px] border-surface-border" onclick="appendNum('2')">2</button>
<button class="active-press bg-white h-20 flex items-center justify-center font-numeric-keypad text-numeric-keypad border-[0.5px] border-surface-border" onclick="appendNum('3')">3</button>
<button class="active-press bg-surface-container h-20 flex items-center justify-center border-[0.5px] border-surface-border" onclick="addOperator('+')">
<span class="material-symbols-outlined text-primary text-3xl">add</span>
</button>
<!-- Row 4 -->
<button class="active-press bg-white h-20 flex items-center justify-center font-numeric-keypad text-numeric-keypad border-[0.5px] border-surface-border" onclick="appendNum('0')">0</button>
<button class="active-press bg-white h-20 flex items-center justify-center font-numeric-keypad text-numeric-keypad border-[0.5px] border-surface-border" onclick="appendNum('.')">.</button>
<button class="active-press bg-primary-container text-on-primary-container h-20 col-span-2 flex items-center justify-center border-[0.5px] border-surface-border" onclick="calculate()">
<span class="material-symbols-outlined text-3xl">equal</span>
</button></div>
<!-- Action Bar -->
<div class="p-container-margin bg-surface pb-10">
<button class="w-full bg-primary text-on-primary h-touch-target rounded-lg font-headline-md text-headline-md flex items-center justify-center gap-2 active:scale-95 transition-transform" onclick="applyTotal()">
<span class="material-symbols-outlined">check_circle</span>
                Apply Total
            </button>
</div>
</main>
<!-- Interaction Script -->
<script>
        let currentInput = '0';
        let history = [];
        let runningTotal = 0;
        let lastActionWasOperator = false;

        const displayTotal = document.getElementById('display-total');
        const calculationString = document.getElementById('calculation-string');

        function updateDisplay() {
            displayTotal.innerText = currentInput;
            calculationString.innerText = history.join(' ') + (currentInput !== '0' && !lastActionWasOperator ? ' ' + currentInput : '');
        }

        function appendNum(num) {
            if (currentInput === '0' && num !== '.') {
                currentInput = num;
            } else {
                currentInput += num;
            }
            lastActionWasOperator = false;
            updateDisplay();
        }

        function addOperator(op) {
            if (lastActionWasOperator) {
                history[history.length - 1] = op;
            } else {
                history.push(currentInput);
                history.push(op);
                currentInput = '0';
            }
            lastActionWasOperator = true;
            updateDisplay();
        }

        function calculate() {
            if (!lastActionWasOperator) {
                history.push(currentInput);
            } else {
                history.pop(); // Remove trailing operator
            }
            
            try {
                // Using basic evaluation for tally
                const result = eval(history.join(''));
                currentInput = result.toString();
                history = [];
                lastActionWasOperator = false;
                updateDisplay();
            } catch (e) {
                currentInput = 'Error';
                updateDisplay();
            }
        }

        function clearTally() {
            currentInput = '0';
            history = [];
            lastActionWasOperator = false;
            updateDisplay();
        }

        function applyTotal() {
            // Final calculation before returning
            calculate();
            const totalValue = displayTotal.innerText;
            alert('Stock count updated to: ' + totalValue);
            // In a real app, this would use window.postMessage or state management to update SCREEN_3
            window.history.back();
        }

        // Initialize with prompt example
        history = ['12', '+', '12', '+'];
        currentInput = '6';
        updateDisplay();
    </script>
</body></html>
