<style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background-color: #E2E8F0; /* Slate-200 / surface-border */
      border: 1px solid #E2E8F0;
    }
    .key-btn {
      background-color: #ffffff;
      height: 4.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.1s;
    }
    .key-btn:active {
      background-color: #f1f5f9; /* Slate-100 */
    }
    .toast-animate {
      animation: slideUpFade 0.3s ease-out forwards;
    }
    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .scroll-hide::-webkit-scrollbar { display: none; }
    .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

<script>
    // Micro-interaction for the keypad
    document.querySelectorAll('.key-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        // Optional: Trigger a small haptic feedback simulator or sound
        console.log('Pressed:', btn.innerText || 'Icon');
      });
    });

    // Auto-hide the toast after 3 seconds
    setTimeout(() => {
      const toast = document.querySelector('.toast-animate');
      if (toast) {
        toast.style.transition = 'opacity 0.5s ease-out';
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 500);
      }
    }, 3000);
  </script>
