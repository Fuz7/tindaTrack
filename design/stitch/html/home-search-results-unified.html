    .keypad-grid {

<script>
    // Micro-interaction for keypad buttons
    document.querySelectorAll('.keypad-grid button').forEach(button => {
      button.addEventListener('touchstart', () => {
        if (window.navigator.vibrate) {
          window.navigator.vibrate(10);
        }
      });
    });
  </script>
