<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Onboarding Step 2 - Inventory Control</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "primary-fixed": "#85f8c4",

                        "tertiary-fixed": "#ffdad7",
                        "secondary": "#565e74",
                        "surface-tint": "#006c4a",
                        "status-in-stock": "#10B981",
                        "secondary-container": "#dae2fd",
                        "outline-variant": "#bccac0",
                        "primary-fixed-dim": "#68dba9",
                        "on-primary": "#ffffff",
                        "tertiary": "#9b3e3b",
                        "on-primary-container": "#f5fff7",
                        "status-out-of-stock": "#EF4444",
                        "on-error": "#ffffff",
                        "surface-container-low": "#eff5ef",
                        "surface-container-high": "#e4eae4",
                        "surface-container": "#e9efe9",
                        "secondary-fixed": "#dae2fd",
                        "action-destructive": "#B91C1C",
                        "surface-variant": "#dee4de",
                        "status-low-stock": "#F59E0B",
                        "tertiary-fixed-dim": "#ffb3ae",
                        "on-background": "#171d19",
                        "on-surface-variant": "#3d4a42",
                        "surface-container-lowest": "#ffffff",
                        "surface-tonal": "#F8FAFC",
                        "error-container": "#ffdad6",
                        "on-surface": "#171d19",
                        "on-tertiary-fixed-variant": "#7f2928",
                        "primary-container": "#00855d",
                        "surface": "#f5fbf5",
                        "tertiary-container": "#ba5551",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#002114",
                        "on-secondary-container": "#5c647a",
                        "surface-dim": "#d5dcd6",
                        "surface-border": "#E2E8F0",
                        "surface-bright": "#f5fbf5",
                        "inverse-surface": "#2c322e",

                        "outline": "#6d7a72",
                        "background": "#f5fbf5",
                        "on-secondary": "#ffffff",
                        "on-tertiary-container": "#fffbff",
                        "on-primary-fixed-variant": "#005137"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "1rem",
                        "stack-md": "1rem",
                        "stack-sm": "0.5rem",
                        "container-margin": "1rem",
                        "touch-target": "3rem"
                    },
                    "fontFamily": {
                        "label-caps": ["Inter", "sans-serif"],

                }
            }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Subtle animation for illustration */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        .illustration-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col justify-between font-body-sm sm:max-w-md sm:mx-auto sm:border-x sm:border-surface-border">
<!-- Top App Bar (Modified for Onboarding) -->
<header class="flex justify-end items-center px-gutter pt-gutter pb-4">
<button class="font-label-caps text-label-caps text-secondary uppercase tracking-wider hover:text-primary transition-colors h-touch-target flex items-center px-2">
            Skip
        </button>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col items-center justify-center px-gutter pb-12">
<!-- Illustration Container -->
<div class="w-full max-w-[280px] aspect-square mb-12 rounded-full bg-surface-container-low flex items-center justify-center relative overflow-hidden shadow-sm border border-surface-border illustration-float">
<!-- Simulated Illustration (using abstract shapes/icons for crispness instead of heavy image) -->
<div class="relative w-3/4 h-3/4 flex flex-col items-center justify-center gap-4">
<!-- Shelf 1 -->
<div class="w-full h-1 bg-outline-variant rounded-full relative">
<div class="absolute bottom-1 left-2 w-8 h-12 bg-primary rounded-sm opacity-90 shadow-sm border border-surface-border"></div>
<div class="absolute bottom-1 left-12 w-6 h-8 bg-tertiary rounded-sm opacity-80 shadow-sm border border-surface-border"></div>
<div class="absolute bottom-1 right-8 w-10 h-10 bg-secondary rounded-sm opacity-70 shadow-sm border border-surface-border"></div>
</div>
<!-- Shelf 2 -->
<div class="w-full h-1 bg-outline-variant rounded-full relative mt-8">
<div class="absolute bottom-1 left-4 w-12 h-6 bg-status-in-stock rounded-sm opacity-80 shadow-sm border border-surface-border"></div>
<div class="absolute bottom-1 right-4 w-8 h-14 bg-surface-tint rounded-sm opacity-90 shadow-sm border border-surface-border"></div>
</div>
<!-- Shelf 3 (Low Stock focus) -->
<div class="w-full h-1 bg-outline-variant rounded-full relative mt-8">
<div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-6 h-6 bg-status-low-stock rounded-sm opacity-90 shadow-sm border border-surface-border flex items-center justify-center">
<span class="material-symbols-outlined text-[12px] text-on-error">warning</span>
</div>
</div>
</div>
<!-- Abstract background element -->
<div class="absolute -right-4 -top-4 w-16 h-16 bg-primary opacity-5 rounded-full blur-xl"></div>
<div class="absolute -left-4 -bottom-4 w-20 h-20 bg-tertiary opacity-5 rounded-full blur-xl"></div>
</div>
<!-- Typography -->
<div class="text-center w-full max-w-xs space-y-4">
<h1 class="font-headline-lg text-headline-lg text-on-background">
                Inventory Control
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Keep your stock organized. Get alerts for low items and update prices in seconds.
            </p>
</div>
</main>
<!-- Bottom Action Area -->
<footer class="px-gutter pb-gutter pt-4 w-full flex flex-col items-center gap-8 border-t border-surface-border bg-surface-bright">
<!-- Pagination Dots -->
<div class="flex gap-2 justify-center items-center">
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-6 h-2 rounded-full bg-primary"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
</div>
<!-- Next Button -->
<button class="w-full h-[56px] rounded-lg bg-primary text-on-primary font-body-lg text-body-lg flex items-center justify-center shadow-md active:bg-primary-container transition-colors duration-150">
            Next
        </button>
</footer>
</body></html>
