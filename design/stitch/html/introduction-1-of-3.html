<style>
        body {
            /* Fallback font just in case */
            font-family: 'Inter', sans-serif;
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        .illustration-container {
            position: relative;
            width: 100%;
            padding-top: 100%; /* 1:1 Aspect Ratio */
            overflow: hidden;
            border-radius: theme('borderRadius.xl');
            background: linear-gradient(135deg, theme('colors.surface-container-low') 0%, theme('colors.surface-container-high') 100%);
            border: 1px solid theme('colors.surface-border');
        }

        .illustration-content {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="min-h-screen flex flex-col items-center justify-center bg-background md:py-8">

<main class="w-full max-w-[400px] h-full md:h-[800px] flex flex-col bg-surface-container-lowest md:border md:border-surface-border md:rounded-[2rem] md:shadow-2xl overflow-hidden relative mx-auto">
<!-- Skip Button (Top Right) -->
<div class="absolute top-6 right-6 z-10">
<button class="text-on-surface-variant font-body-sm text-body-sm hover:text-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary rounded p-1">
                Skip
            </button>
</div>
<!-- Content Area -->
<div class="flex-1 flex flex-col px-container-margin pt-16 pb-8 h-full">
<!-- Illustration Area -->
<div class="flex-1 flex items-center justify-center mb-8 mt-4">

</div>

<h1 class="font-headline-lg text-headline-lg text-on-background">
                    Smart Calculation
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[300px]">
                    Quickly tally sales with our built-in calculator and search integration.
                </p>
</div>
<!-- Bottom Controls -->
<div class="mt-8 flex flex-col space-y-8 w-full">
<!-- Progress Indicators -->
<div class="flex justify-center space-x-2">
<div class="w-8 h-2 rounded-full bg-primary"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
</div>
<!-- Next Button -->
<button class="w-full h-touch-target bg-primary text-on-primary font-headline-md text-headline-md rounded-xl flex items-center justify-center active:bg-primary-container active:text-on-primary-container transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
                    Next
                </button>
</div>
</div>
