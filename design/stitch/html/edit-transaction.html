<script>
        // Simple micro-interaction for item controls
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                if (this.textContent.includes('add') || this.textContent.includes('remove')) {
                    const parent = this.closest('.flex.items-center.border');
                    const span = parent.querySelector('span');
                    let val = parseInt(span.textContent);
                    if (this.textContent.includes('add')) val++;
                    else if (val > 1) val--;
                    span.textContent = val;
                }
            });
        });
    </script>
