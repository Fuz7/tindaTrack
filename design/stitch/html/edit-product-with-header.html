<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "inverse-on-surface": "#ecf2ec",
                    "primary-fixed-dim": "#68dba9",
                    "inverse-primary": "#68dba9",

                    "surface-variant": "#dee4de",

                    "on-primary-container": "#f5fff7",
                    "on-background": "#171d19",
                    "surface-container": "#e9efe9",
                    "on-secondary": "#ffffff",
                    "on-error-container": "#93000a",
                    "status-low-stock": "#F59E0B",
                    "tertiary-fixed": "#ffdad7",
                    "surface-container-low": "#eff5ef",
                    "surface-dim": "#d5dcd6",
                    "secondary-fixed-dim": "#bec6e0",
                    "tertiary-container": "#ba5551",
                    "on-surface": "#171d19",
                    "surface-container-lowest": "#ffffff",
                    "surface-tonal": "#F8FAFC",
                    "error": "#ba1a1a",
                    "on-primary": "#ffffff",
                    "surface": "#f5fbf5",
                    "on-primary-fixed": "#002114",
                    "status-out-of-stock": "#EF4444",
                    "surface-tint": "#006c4a",
                    "on-secondary-fixed-variant": "#3f465c",
                    "secondary-fixed": "#dae2fd",
                    "on-tertiary-fixed-variant": "#7f2928",
                    "secondary": "#565e74",
                    "tertiary-fixed-dim": "#ffb3ae",
                    "surface-border": "#E2E8F0",
                    "status-in-stock": "#10B981",
                    "outline": "#6d7a72",
                    "secondary-container": "#dae2fd",
                    "tertiary": "#9b3e3b",
                    "primary-container": "#00855d",
                    "surface-bright": "#f5fbf5",
                    "on-tertiary-container": "#fffbff",
                    "inverse-surface": "#2c322e",
                    "primary-fixed": "#85f8c4",
                    "on-secondary-container": "#5c647a",
                    "on-error": "#ffffff",
                    "action-destructive": "#B91C1C",
                    "on-tertiary-fixed": "#410004",
                    "on-tertiary": "#ffffff",
                    "on-surface-variant": "#3d4a42",
                    "surface-container-high": "#e4eae4",
                    "outline-variant": "#bccac0",
                    "on-primary-fixed-variant": "#005137",
                    "background": "#f5fbf5"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "touch-target": "3rem",
                    "stack-sm": "0.5rem",
                    "gutter": "1rem",
                    "stack-md": "1rem",
                    "container-margin": "1rem"
            },
            "fontFamily": {
                    "numeric-keypad": ["Inter"],
                    "display-price": ["Inter"],
                    "body-sm": ["Inter"],
                    "body-lg": ["Inter"],
                    "label-caps": ["Inter"],
                    "headline-lg": ["Inter"],
                    "headline-md": ["Inter"]
            },
            "fontSize": {
                    "numeric-keypad": ["24px", {"lineHeight": "24px", "fontWeight": "500"}],
                    "display-price": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "500"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                    "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .touch-active:active { transform: scale(0.98); background-color: var(--tw-surface-container-highest); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen pb-32">
<!-- Top AppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline flex justify-between items-center px-gutter h-touch-target z-50">
<div class="flex items-center gap-3">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active:bg-surface-container-highest">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim">store</span>
</button>
<h1 class="font-headline-lg text-headline-lg text-primary dark:text-primary-fixed-dim">TindaTrack</h1>
</div>
<div class="flex items-center">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active:bg-surface-container-highest">
<span class="material-symbols-outlined text-on-surface-variant">settings</span>
</button>
</div>
</header>
<main class="max-w-md mx-auto px-gutter pt-gutter">
<!-- Subtitle & Context (Screen Title) -->
<div class="mb-4 flex items-center gap-2">
<button class="w-8 h-8 flex items-center justify-center rounded-full active:bg-surface-container-highest">
<span class="material-symbols-outlined text-on-surface text-[20px]">arrow_back</span>
</button>
<h2 class="font-headline-md text-headline-md text-on-surface">Edit Product</h2>
</div>
<div class="mb-6">
<p class="font-body-sm text-body-sm text-on-surface-variant">Update product details and stock information.</p>
</div>
<!-- Image Section -->
<div class="relative w-full aspect-square rounded-xl overflow-hidden border border-outline-variant bg-surface-container mb-8">
<img class="w-full h-full object-contain" data-alt="A clean, professional product photograph of a 300ml bottle of Royal Tru Orange soda, positioned against a minimalist, bright white studio background. The vibrant orange liquid and branding are sharp and clear, catching the high-key, even lighting. The visual style is modern, clinical, and high-density, consistent with a professional retail management application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuApCODfVEgHp4YB2LKE4kD08ajy1oHjMJpzQ_oBP_CnzQa-WslrEDhEE-_dqk8kb11E1iTIzJ_rMZ7P4P03DlU6J1QApMZIJIFRrJjv58GMRZprgYJfLuo1QGOvssYbNTVc8UQDDpyt4-xiTFSyEI_u64sVM6CVW1jEUyYLI2WKC2asdtVame4UG20F1YqBTQsXTvwEKPXclyO8pKUf-PL80Ir-j2NHBLvMp7VU8mLDYG5dnsxauJFTuUq_ifG37LR47vxISqsRuKTi">
<div class="absolute inset-0 bg-black/40 flex flex-col items-center justify-center opacity-100 transition-opacity">
<button class="bg-surface/90 text-on-surface px-4 py-2 rounded-full font-label-caps text-label-caps flex items-center gap-2 shadow-lg active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[18px]">edit</span>
                    EDIT IMAGE
                </button>
</div>
</div>
<!-- Form Section -->
<div class="space-y-6">
<!-- Product Name -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Product Name</label>
<input class="w-full bg-surface border border-outline-variant focus:border-2 focus:border-primary rounded-lg px-4 h-12 font-body-lg text-body-lg outline-none transition-all" type="text" value="Royal Tru Orange 300ml">
</div>
<!-- Price Row -->
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Buy Price (₱)</label>
<input class="w-full bg-surface border border-outline-variant focus:border-2 focus:border-primary rounded-lg px-4 h-12 font-body-lg text-body-lg outline-none transition-all" type="text" value="15.50">
</div>
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Sell Price (₱)</label>
<input class="w-full bg-surface border border-outline-variant focus:border-2 focus:border-primary rounded-lg px-4 h-12 font-body-lg text-body-lg outline-none transition-all" type="text" value="18.00">
</div>
</div>
<!-- Stock Count with Calculator Button -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Current Stock Count</label>
<div class="flex gap-2">
<input class="flex-grow bg-surface border border-outline-variant focus:border-2 focus:border-primary rounded-lg px-4 h-12 font-body-lg text-body-lg outline-none transition-all" type="number" value="24">
<button class="w-12 h-12 bg-secondary-container text-on-secondary-container flex items-center justify-center rounded-lg active:scale-95 transition-transform border border-outline-variant">
<span class="material-symbols-outlined">calculate</span>
</button>
</div>
</div>
<!-- Categories -->
<div class="space-y-3">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Category</label>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full border border-primary bg-primary-container text-on-primary-container font-label-caps text-label-caps">Drinks</button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-caps text-label-caps">Snacks</button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-caps text-label-caps">Pantry</button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-caps text-label-caps">Canned</button>
<button class="px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-caps text-label-caps">Household</button>
<button class="px-4 py-2 rounded-full border border-primary text-primary font-label-caps text-label-caps flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">add</span>
                        Add Custom
                    </button>
</div>
</div>
<!-- Primary Action -->
<div class="pt-6">
<button class="w-full bg-primary-container hover:bg-primary text-on-primary-container font-headline-md text-headline-md h-14 rounded-xl shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">save</span>
                    Save Changes
                </button>
<button class="w-full mt-4 bg-transparent text-error font-body-lg text-body-lg py-2 rounded-lg flex items-center justify-center gap-2 hover:bg-error-container/20">
<span class="material-symbols-outlined">delete</span>
                    Delete Product
                </button>
</div>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 h-16 bg-surface dark:bg-surface-dim border-t border-outline-variant dark:border-outline shadow-lg flex justify-around items-center px-container-margin pb-safe">
<a class="flex flex-col items-center justify-center text-on-secondary-fixed-variant p-2 hover:bg-surface-container-low transition-all active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-caps text-label-caps mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl p-2 hover:bg-surface-container-low transition-all active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="inventory_2" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
<span class="font-label-caps text-label-caps mt-1">Inventory</span>
</a>
<a class="flex flex-col items-center justify-center text-on-secondary-fixed-variant p-2 hover:bg-surface-container-low transition-all active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span class="font-label-caps text-label-caps mt-1">Receipts</span>
</a>
<a class="flex flex-col items-center justify-center text-on-secondary-fixed-variant p-2 hover:bg-surface-container-low transition-all active:scale-95 duration-100" href="#">
<span class="material-symbols-outlined" data-icon="analytics">analytics</span>
<span class="font-label-caps text-label-caps mt-1">Analytics</span>
</a>
</nav>
<script>
        // Micro-interactions for category selection
        document.querySelectorAll('.flex-wrap button').forEach(button => {
            button.addEventListener('click', function() {
                if(this.textContent.includes('Add Custom')) return;
                
                // Deselect all
                document.querySelectorAll('.flex-wrap button').forEach(btn => {
                    if(!btn.textContent.includes('Add Custom')) {
                        btn.className = 'px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-caps text-label-caps';
                    }
                });
                
                // Select clicked
                this.className = 'px-4 py-2 rounded-full border border-primary bg-primary-container text-on-primary-container font-label-caps text-label-caps';
            });
        });

        // Numeric input validation for price
        document.querySelectorAll('input[type="text"]').forEach(input => {
            if(input.value.includes('.')) {
                input.addEventListener('input', function(e) {
                    this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');
                });
            }
        });
    </script>
</body></html>
