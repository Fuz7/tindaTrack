<style>
        body { font-family: 'Inter', sans-serif; }

<body class="bg-surface text-on-surface flex justify-center min-h-screen">
<!-- Max-width Mobile Container -->
<main class="w-full max-w-[440px] bg-white flex flex-col relative shadow-2xl min-h-screen pb-safe">
<!-- Header (Point 1) -->
<header class="bg-surface dark:bg-surface-dim w-full top-0 sticky border-b border-outline-variant dark:border-outline flex justify-between items-center px-gutter h-touch-target z-50">
<div class="flex items-center gap-2 flex-1 justify-center">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-bold text-xs">
                    SP
                </div>
<h1 class="text-headline-md-mobile font-headline-md text-primary dark:text-primary-fixed-dim">TindaTrack</h1>
</div>
<button class="material-symbols-outlined text-primary hover:bg-surface-container-high transition-colors p-2 rounded-lg">settings</button>
</header>
<!-- Main Scrollable Area -->
<div class="flex-1 overflow-y-auto hide-scrollbar">
<!-- Navigation (Point 2) -->
<div class="px-gutter pt-4 pb-2">
<button class="flex items-center gap-1.5 text-on-surface-variant hover:text-primary transition-colors py-1 px-0 font-medium text-sm" onclick="history.back()">
<span class="material-symbols-outlined !text-[18px]">arrow_back</span>
<span class="">Back to Cart</span>
</button>
</div>
<!-- PAYMENT SUMMARY (Points 3, 4, 5, 6) -->
<section class="px-gutter mb-6">

</section>
<!-- Payment Method (Preserved but integrated) -->
<section class="px-gutter mb-8">
<div class="flex gap-2">
<button class="flex-1 flex items-center justify-center gap-2 p-3 rounded-xl border-2 border-primary bg-primary-container text-on-primary-container transition-all" id="payCash">
<span class="material-symbols-outlined !text-[20px]">payments</span>
<span class="font-label-caps text-label-caps">CASH</span>
</button>
<button class="flex-1 flex items-center justify-center gap-2 p-3 rounded-xl border border-outline-variant bg-surface-container-low text-on-surface-variant transition-all" id="payGCash">
<span class="material-symbols-outlined !text-[20px]">qr_code_2</span>
<span class="font-label-caps text-label-caps">G-CASH</span>
</button>
</div>
</section>
<!-- ORDER SUMMARY (Point 7) -->
<section class="px-gutter mb-8">
<details class="group bg-surface-container rounded-xl border border-outline-variant overflow-hidden" open="">
<summary class="flex justify-between items-center p-4 cursor-pointer hover:bg-surface-container-high transition-colors list-none">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary group-open:rotate-180 transition-transform">expand_more</span>
<h2 class="font-label-caps text-label-caps text-on-surface-variant">ORDER SUMMARY (3 ITEMS)</h2>
</div>
<span class="font-body-sm text-body-sm font-bold">₱127.00</span>
</summary>
<div class="p-4 pt-0 space-y-3 border-t border-outline-variant/30 mt-2">
<div class="flex justify-between items-start text-sm">
<div>
<p class="font-medium">Lucky Me Pancit Canton</p>
<p class="text-xs text-on-surface-variant">2 x ₱18.50</p>
</div>
<p class="font-bold">₱37.00</p>
</div>
<div class="flex justify-between items-start text-sm">
<div>
<p class="font-medium">Coke 500ml</p>
<p class="text-xs text-on-surface-variant">1 x ₱25.00</p>
</div>
<p class="font-bold">₱25.00</p>
</div>
<div class="flex justify-between items-start text-sm">
<div>
<p class="font-medium">Gardenia Classic White</p>
<p class="text-xs text-on-surface-variant">1 x ₱65.00</p>
</div>
<p class="font-bold">₱65.00</p>
</div>
<div class="pt-3 mt-3 border-t border-dashed border-outline-variant flex justify-between items-center text-xs text-on-surface-variant">
<span class="">Subtotal</span>
<span class="">₱127.00</span>
</div>
</div>
</details>
</section>
</div>
<!-- Footer Action (Point 8) -->
<footer class="p-gutter bg-white border-t border-outline-variant sticky bottom-0">
<button class="w-full bg-primary text-on-primary py-4 rounded-xl font-headline-md text-headline-md shadow-lg shadow-primary/20 hover:bg-primary-container transition-all active:scale-[0.98] flex items-center justify-center gap-3" id="completeSale">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                COMPLETE SALE
            </button>
</footer>
</main>
<script>
        const total = 127.00;
        const cashInput = document.getElementById('cashInput');
        const changeDisplay = document.getElementById('changeDisplay');
        const payCashBtn = document.getElementById('payCash');
        const payGCashBtn = document.getElementById('payGCash');

        // Payment Method Switching
        payCashBtn.addEventListener('click', () => {
            payCashBtn.className = 'flex-1 flex items-center justify-center gap-2 p-3 rounded-xl border-2 border-primary bg-primary-container text-on-primary-container transition-all';
            payGCashBtn.className = 'flex-1 flex items-center justify-center gap-2 p-3 rounded-xl border border-outline-variant bg-surface-container-low text-on-surface-variant transition-all';
        });

        payGCashBtn.addEventListener('click', () => {
            payGCashBtn.className = 'flex-1 flex items-center justify-center gap-2 p-3 rounded-xl border-2 border-primary bg-primary-container text-on-primary-container transition-all';
            payCashBtn.className = 'flex-1 flex items-center justify-center gap-2 p-3 rounded-xl border border-outline-variant bg-surface-container-low text-on-surface-variant transition-all';
        });

        // Change Calculation Logic
        function updateChange() {
            const received = parseFloat(cashInput.value) || 0;
            const change = received - total;
            if (change >= 0) {
                changeDisplay.textContent = `₱${change.toFixed(2)}`;
                changeDisplay.classList.remove('text-on-surface');
                changeDisplay.classList.add('text-primary');
            } else {
                changeDisplay.textContent = `₱0.00`;
                changeDisplay.classList.add('text-on-surface');
                changeDisplay.classList.remove('text-primary');
            }
        }

        cashInput.addEventListener('input', updateChange);

        function addCash(amount) {
            const current = parseFloat(cashInput.value) || 0;
            cashInput.value = (current + amount).toFixed(2);
            updateChange();
            
            // Visual feedback
            cashInput.classList.add('ring-4', 'ring-primary/20');
            setTimeout(() => cashInput.classList.remove('ring-4', 'ring-primary/20'), 300);
        }

        function clearCash() {
            cashInput.value = '';
            updateChange();
            cashInput.focus();
        }

        // Completion Interaction
        document.getElementById('completeSale').addEventListener('click', function() {
            const received = parseFloat(cashInput.value) || 0;
            if (received < total) {
                alert('Insufficient cash received');
                return;
            }
            
            this.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span> PROCESSING...`;
            this.disabled = true;
            
            setTimeout(() => {
                this.innerHTML = `<span class="material-symbols-outlined">verified</span> SALE COMPLETED`;
                this.classList.replace('bg-primary', 'bg-status-in-stock');
                
                const toast = document.createElement('div');
                toast.className = 'fixed top-20 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-6 py-3 rounded-full shadow-2xl z-[100] transition-all opacity-0 translate-y-4';
                toast.textContent = 'Receipt Printed Successfully';
                document.body.appendChild(toast);
                
                setTimeout(() => {
                    toast.classList.remove('opacity-0', 'translate-y-4');
                }, 100);
            }, 1200);
        });
    </script>
