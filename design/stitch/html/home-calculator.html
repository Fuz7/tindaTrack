<script>
        let currentEntry = "0.00";
        const display = document.getElementById('price-display');

        function appendDigit(digit) {
            if (currentEntry === "0.00") {
                currentEntry = digit;
            } else {
                currentEntry += digit;
            }
            updateDisplay();
        }

        function clearEntry() {
            currentEntry = "0.00";
            updateDisplay();
        }

        function updateDisplay() {
            // Basic formatting for currency entry simulation
            let numeric = parseFloat(currentEntry);
            if (currentEntry.includes('.')) {
                display.innerText = currentEntry;
            } else {
                display.innerText = (numeric).toFixed(2);
            }
        }

        function addToCart() {
            if (currentEntry === "0.00") return;
            
            const cart = document.getElementById('cart-items');
            const newPrice = parseFloat(currentEntry).toFixed(2);
            
            const itemHTML = `
                <div class="py-4 flex items-center justify-between animate-in fade-in slide-in-from-right-4 duration-300">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded bg-surface-container-high flex items-center justify-center border border-outline-variant">
                            <span class="material-symbols-outlined text-primary" data-icon="sell">sell</span>
                        </div>
                        <div>
                            <p class="font-body-lg text-on-surface">Manual Entry</p>
                            <p class="text-body-sm text-on-surface-variant">Qty: 1 × ₱${newPrice}</p>
                        </div>
                    </div>
                    <div class="flex flex-col items-end gap-1">
                        <span class="font-body-lg text-on-surface">₱${newPrice}</span>
                        <button class="text-error active:scale-90 transition-transform" onclick="this.closest('.py-4').remove()">
                            <span class="material-symbols-outlined text-sm" data-icon="delete">delete</span>
                        </button>
                    </div>
                </div>
            `;
            cart.insertAdjacentHTML('afterbegin', itemHTML);
            clearEntry();
        }

        function clearCart() {
            if(confirm('Are you sure you want to clear the current cart?')) {
                document.getElementById('cart-items').innerHTML = '';
            }
        }

        // Haptic feel - numeric keypad interactions
        document.querySelectorAll('.keypad-button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                if (window.navigator.vibrate) window.navigator.vibrate(10);
            });
        });
    </script>
